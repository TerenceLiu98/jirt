[project]
name = "jirt"
version = "0.1.0"
description = "Item response theory in Python and JAX"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "TerenceLiu", email = "terenceliu1012@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.12.0.1",
    "numpy>=2.5.5",
    "scipy>=1.14",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
