name: tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'LICENSE'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts examples
      - run: uv run ruff format --check src tests scripts examples
      - run: uv run pytest
      - run: uv run python examples/all_models.py
      - run: uv run python examples/logistic.py
      - run: uv run python examples/multidimensional.py
      - run: uv run python examples/polytomous.py
      - run: uv run python examples/nominal.py
      - run: uv run python examples/response_models.py
      - run: uv build
