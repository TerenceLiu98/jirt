name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_tag="v$(uv version --short)"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            printf 'Expected release tag %s, got %s\n' "$expected_tag" "$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Build distributions
        run: uv build --no-sources
      - name: Check distribution metadata
        run: uvx --python 3.12 twine check --strict dist/*.whl dist/*.tar.gz
      - name: Smoke-test both distributions
        run: |
          for archive in dist/*.whl dist/*.tar.gz; do
            uv run --python 3.12 --isolated --no-project --with "$archive" \
              python -c 'import jax, jirt; print(jirt.__version__, jax.devices())'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Upload to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          : "${UV_PUBLISH_TOKEN:?Set the UV_PUBLISH_TOKEN Actions secret}"
          uv publish --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz
